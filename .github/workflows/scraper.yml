name: Update IPO & GMP Data

on:
  schedule:
    - cron: '*/30 3-12 * * 1-5' # Runs every 30 minutes during IST trading hours (Mon-Fri)
    - cron: '0 0,14 * * *'        # Runs once at start/end of day
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4 psycopg2-binary

      - name: Run Scraper Script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/scrape_ipos.py